const slides=[{type:"title",content:{title:"snoolink",subtitle:"Social Media Curation and Creation Model",tagline:"From raw footage to viral reels — in seconds"}},{type:"problem",content:{title:"The Problem",subtitle:"Content creation is broken",points:["Creators have thousands of videos sitting unused on their phones","Finding the perfect moment takes hours of manual scrubbing","Editing reels requires expensive software and steep learning curves","Consistent posting demands 10+ hours per week of repetitive work"],stat:"73% of creators say editing is their biggest bottleneck"}},{type:"solution",content:{title:"The Solution",subtitle:"AI that understands your content",description:"snoolink is a mobile app that automatically analyzes your entire video library, finds the perfect moments, and assembles professional reels — all from a simple text prompt.",example:'"Create a 30-second reel of me at the beach with upbeat vibes"'}},{type:"how",content:{title:"How It Works",steps:[{number:"1",title:"AI Analysis",desc:"snoolink scans your video library using computer vision to understand scenes, emotions, settings, and key moments"},{number:"2",title:"Smart Selection",desc:"Natural language search finds exact clips and timestamps matching your genre and requirements"},{number:"3",title:"Auto-Assembly",desc:"AI stitches clips together with smooth transitions, auto-captions, and trending audio"},{number:"4",title:"Post or Refine",desc:"One-tap export to Instagram, TikTok, or YouTube — or make quick edits in-app"}]}},{type:"features",content:{title:"Key Features",features:[{icon:"🔍",title:"Semantic Video Search",desc:'Find clips using natural language: "sunsets", "laughing with friends", "product close-ups"'},{icon:"⏱️",title:"Timestamp Precision",desc:"AI identifies exact golden moments within each video — no manual scrubbing"},{icon:"🎬",title:"Genre-Based Assembly",desc:"Automatically match pacing, transitions, and music to your content type"},{icon:"✨",title:"One-Tap Reels",d tRequestFullscreen():e.mozRequestFullScreen?e.mozRequestFullScreen():e.msRequestFullscreen&&e.msRequestFullscreen(),document.getElementById("fullscreenBtn").innerHTML='<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>Exit Fullscreen')}document.addEventListener("keydown",e=>{"ArrowRight"!==e.key&&" "!==e.key||(e.preventDefault(),nextSlide()),"ArrowLeft"===e.key&&(e.preventDefault(),prevSlide()),"f"!==e.key&&"F"!==e.key||(e.preventDefault(),toggleFullscreen())}),document.addEventListener("fullscreenchange",()=>{document.fullscreenElement||(document.getElementById("fullscreenBtn").innerHTML='<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>Fullscreen')}),window.addEventListener("DOMContentLoaded",()=>{document.getElementById("app").innerHTML=`<div id="fullscreenContainer" class="fullscreen-container w-full h-full flex flex-col"><div class="print-slides">${slides.map(e=>`<div class="print-slide" style="page-break-after:always;width:100vw;height:100vh">${renderSlide(e)}</div>`).join("")}</div><div class="screen-only flex-1 relative" style="max-height:90vh"><div class="h-full overflow-auto" id="slideContainer">${renderSlide(slides[0])}</div></div><div class="bg-gray-800 text-white p-4 flex items-center justify-between no-print"><button onclick="prevSlide()" class="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>Previous</button><div class="flex items-center gap-6"><button id="fullscreenBtn" onclick="toggleFullscreen()" class="flex items-center gap-2 px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors font-semibold"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>Fullscreen</button><button onclick="window.print()" class="flex items-center gap-2 px-6 py-2 bg-green-600 hover:bg-green-500 rounded-lg transition-colors font-semibold"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>Download PDF</button><span class="text-sm" id="slideCounter">Slide 1 of ${slides.length}</span><div class="flex gap-1" id="dotsContainer">${slides.map((e,t)=>`<button onclick="currentSlide=${t};updateSlide();" class="w-2 h-2 rounded-full transition-colors ${0===t?"bg-white":"bg-gray-600 hover:bg-gray-500"}"></button>`).join("")}</div></div><button onclick="nextSlide()" class="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">Next<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button></div></div>`});
